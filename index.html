        body{
          margin: 0;

        .progress-bar-container{
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate (-50%, -50%) ;
        width: 50%;
        height: 20%;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      #progress-bar{
        justify-content: center;
        width: 30%;
        margin-top: 0.5%;
        height: 20%;
      }
      label{
        color: black;
        font-size: 2rem;
      }
      </style>

<body>
  <!-- Loading Screen -->
  <div id="loading-screen">

      <div class="spinner"></div>
      <p id="loading-text">Loading... <span id="loading-percent">0%</span></p>
      <div class="progress-wrapper">
        <div id="progress-bar"></div>
      </div>
    </div>
  </div>
