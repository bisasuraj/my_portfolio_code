<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="description" content="Personal portfolio showcasing my work and projects" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="screen-orientation" content="landscape" />
    <link rel="icon" type="image/svg+xml" href="/my_portfolio_code/assets/favicon-OtBKyZol.svg" />
    <title>My Portfolio</title>
    <style>
      @media screen and (orientation: portrait) and (max-width: 768px) {
        body::before {
          content: "Please rotate your device to Landscape mode";
          position: fixed;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          background: rgba(0, 0, 0, 0.95);
          color: white;
          display: flex;
          align-items: center;
          justify-content: center;
          z-index: 9999;
          font-size: 1.5rem;
          text-align: center;
          padding: 2rem;
        }
      }

      body {
        margin: 0;
        padding: 0;
      }

      .progress-bar-container {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 50%;
        height: 20%;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      #progress-bar {
        justify-content: center;
        width: 30%;
        margin-top: 0.5%;
        height: 20%;
      }

      label {
        color: black;
        font-size: 2rem;
      }

      /* Virtual Joystick Styles */
      #joystick-container {
        display: none;
        position: fixed;
        bottom: 20px;
        left: 20px;
        width: 150px;
        height: 150px;
        z-index: 1000;
      }

      /* Show joystick only on mobile/tablet */
      @media (max-width: 768px), (pointer: coarse) {
        #joystick-container {
          display: block;
        }
      }

      #joystick-base {
        position: absolute;
        width: 150px;
        height: 150px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.2);
        border: 3px solid rgba(255, 255, 255, 0.5);
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      }

      #joystick-stick {
        position: absolute;
        width: 60px;
        height: 60px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.8);
        border: 3px solid rgba(255, 255, 255, 1);
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        transition: background 0.1s;
      }

      #joystick-stick.active {
        background: rgba(100, 200, 255, 0.9);
      }
    </style>
    <script type="module" crossorigin src="/my_portfolio_code/assets/index-ssCRyoPF.js"></script>
    <link rel="stylesheet" crossorigin href="/my_portfolio_code/assets/index-CIewlsL6.css">
  </head>
  <body>
    <!-- Loading Screen -->
    <div id="loading-screen">
      <div class="loader">
        <div class="spinner"></div>
        <p id="loading-text">Loading... <span id="loading-percent">0%</span></p>
        <div class="progress-wrapper">
          <div id="progress-bar"></div>
        </div>
      </div>
    </div>

    <!-- Virtual Joystick -->
    <div id="joystick-container">
      <div id="joystick-base"></div>
      <div id="joystick-stick"></div>
    </div>

    <!-- Three.js Canvas -->
    <canvas id="bg"></canvas>

  </body>
</html>
